<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="316" viewBox="0 0 1200 316" role="img" aria-labelledby="title desc">
  <title id="title">Say Alive</title>
  <desc id="desc">A bilingual writing skill. Editorial marks highlight the facts, conditions and voice kept in a draft.</desc>
  <rect width="1200" height="316" rx="16" fill="#F4EFE4"/>
  <g id="wordmark" fill="#232620">
    <text x="62" y="73" fill="#64665B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="2.4">ZH / EN  ·  WRITING SKILL</text>
    <text x="57" y="177" font-family="Georgia, Times New Roman, serif" font-size="109" font-weight="700" letter-spacing="-5">Say Alive</text>
    <text x="64" y="246" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="39">写清楚，保住原意。</text>
  </g>
  <path d="M642 49v218" fill="none" stroke="#CEC8BA" stroke-width="2"/>
  <g id="editorial-marks">
    <text x="699" y="74" fill="#64665B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" letter-spacing="2">EDITOR’S NOTES</text>
    <g fill="#232620" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="42" font-weight="600">
      <text x="700" y="136">事实</text>
      <text x="700" y="198">条件</text>
      <text x="700" y="260">口气</text>
    </g>
    <g fill="none" stroke="#27564C" stroke-width="3" stroke-linecap="round">
      <path d="M697 144q42-5 89-1m-89 63q42-5 89-1m-89 63q42-5 89-1"/>
      <path d="M812 117h26m-26 62h26m-26 62h26"/>
    </g>
    <g fill="#27564C" font-family="Georgia, Times New Roman, serif" font-size="36">
      <text x="858" y="135">Facts</text>
      <text x="858" y="197">Conditions</text>
      <text x="858" y="259">Voice</text>
    </g>
  </g>
</svg>
